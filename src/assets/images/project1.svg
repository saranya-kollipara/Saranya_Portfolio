<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg1)" />
  <rect width="600" height="400" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Stylized Console / Window -->
  <g transform="translate(50, 50)">
    <rect width="500" height="300" rx="12" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.03))" />
    
    <!-- Window Header -->
    <rect width="500" height="40" rx="12" fill="#f1f5f9" />
    <rect y="30" width="500" height="10" fill="#f1f5f9" />
    <circle cx="20" cy="20" r="6" fill="#ef4444" />
    <circle cx="40" cy="20" r="6" fill="#eab308" />
    <circle cx="60" cy="20" r="6" fill="#22c55e" />
    <text x="250" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="500">Database &amp; Analytics Dashboard</text>
    
    <!-- Database Icon & Charts inside Window -->
    <line x1="40" y1="80" x2="460" y2="80" stroke="#f1f5f9" stroke-width="1.5" />
    
    <!-- Database Graphic (Left) -->
    <g transform="translate(60, 110)">
      <rect x="0" y="0" width="100" height="130" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5" />
      <text x="50" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#4f46e5" font-weight="bold" text-anchor="middle">MySQL</text>
      <!-- DB Cylinders -->
      <g transform="translate(20, 45)" fill="none" stroke="#4f46e5" stroke-width="2">
        <path d="M 0,10 A 30,8 0 1,0 60,10 A 30,8 0 1,0 0,10 Z" fill="#c7d2fe" />
        <path d="M 0,10 L 0,25 A 30,8 0 0,0 60,25 L 60,10" />
        <path d="M 0,25 L 0,40 A 30,8 0 0,0 60,40 L 60,25" />
        <path d="M 0,40 L 0,55 A 30,8 0 0,0 60,55 L 60,40" />
      </g>
    </g>
    
    <!-- Data Analytics Bar Graph (Right) -->
    <g transform="translate(200, 110)">
      <rect x="0" y="0" width="240" height="130" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5" />
      <text x="120" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#0891b2" font-weight="bold" text-anchor="middle">Data Trends</text>
      
      <!-- Graph Bars -->
      <g transform="translate(30, 45)">
        <line x1="0" y1="60" x2="180" y2="60" stroke="#0891b2" stroke-width="1.5" />
        <line x1="0" y1="0" x2="0" y2="60" stroke="#0891b2" stroke-width="1.5" />
        
        <rect x="20" y="25" width="20" height="35" rx="2" fill="#06b6d4" />
        <rect x="55" y="10" width="20" height="50" rx="2" fill="#4f46e5" />
        <rect x="90" y="35" width="20" height="25" rx="2" fill="#06b6d4" />
        <rect x="125" y="15" width="20" height="45" rx="2" fill="#4f46e5" />
        
        <path d="M 30,20 L 65,5 L 100,30 L 135,10" fill="none" stroke="#f43f5e" stroke-width="2" />
        <circle cx="30" cy="20" r="3" fill="#f43f5e" />
        <circle cx="65" cy="5" r="3" fill="#f43f5e" />
        <circle cx="100" cy="30" r="3" fill="#f43f5e" />
        <circle cx="135" cy="10" r="3" fill="#f43f5e" />
      </g>
    </g>
    
    <text x="40" y="275" font-family="monospace" font-size="11" fill="#94a3b8">SELECT * FROM users WHERE active = 1;</text>
  </g>
</svg>
