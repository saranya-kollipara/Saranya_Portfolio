<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg2)" />
  <rect width="600" height="400" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Stylized Console / Window -->
  <g transform="translate(50, 50)">
    <rect width="500" height="300" rx="12" fill="url(#cardGrad2)" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.03))" />
    
    <!-- Window Header -->
    <rect width="500" height="40" rx="12" fill="#f1f5f9" />
    <rect y="30" width="500" height="10" fill="#f1f5f9" />
    <circle cx="20" cy="20" r="6" fill="#ef4444" />
    <circle cx="40" cy="20" r="6" fill="#eab308" />
    <circle cx="60" cy="20" r="6" fill="#22c55e" />
    <text x="250" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="500">Algorithm Visualizer &amp; Code Flow</text>
    
    <line x1="40" y1="80" x2="460" y2="80" stroke="#f1f5f9" stroke-width="1.5" />
    
    <!-- Algorithm Node Tree (Left) -->
    <g transform="translate(60, 100)" stroke-linecap="round">
      <line x1="80" y1="30" x2="40" y2="70" stroke="#3b82f6" stroke-width="2" />
      <line x1="80" y1="30" x2="120" y2="70" stroke="#3b82f6" stroke-width="2" />
      <line x1="40" y1="70" x2="20" y2="110" stroke="#3b82f6" stroke-width="2" />
      <line x1="40" y1="70" x2="60" y2="110" stroke="#3b82f6" stroke-width="2" />
      
      <!-- Nodes -->
      <circle cx="80" cy="30" r="16" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
      <text x="80" y="34" font-family="system-ui, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">Root</text>
      
      <circle cx="40" cy="70" r="14" fill="#60a5fa" stroke="#ffffff" stroke-width="2" />
      <text x="40" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">L</text>
      
      <circle cx="120" cy="70" r="14" fill="#a78bfa" stroke="#ffffff" stroke-width="2" />
      <text x="120" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">R</text>
      
      <circle cx="20" cy="110" r="12" fill="#93c5fd" stroke="#ffffff" stroke-width="2" />
      <circle cx="60" cy="110" r="12" fill="#93c5fd" stroke="#ffffff" stroke-width="2" />
    </g>
    
    <!-- Code Editor Panel (Right) -->
    <g transform="translate(240, 100)">
      <rect x="0" y="0" width="200" height="130" rx="8" fill="#1e1e2e" />
      <text x="15" y="25" font-family="monospace" font-size="11" fill="#f8f8f2">
        <tspan x="15" dy="0" fill="#f1fa8c">def</tspan> <tspan fill="#50fa7b">dfs</tspan>(node):
        <tspan x="30" dy="18" fill="#ff79c6">if not</tspan> node: <tspan fill="#ff79c6">return</tspan>
        <tspan x="30" dy="18" fill="#50fa7b">visit</tspan>(node)
        <tspan x="30" dy="18">dfs(node.left)</tspan>
        <tspan x="30" dy="18">dfs(node.right)</tspan>
      </text>
    </g>
    
    <text x="40" y="275" font-family="monospace" font-size="11" fill="#94a3b8">Complexity: O(V + E) | Space: O(H)</text>
  </g>
</svg>
