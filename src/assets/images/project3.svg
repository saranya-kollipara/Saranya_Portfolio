<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg3)" />
  <rect width="600" height="400" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Stylized Console / Window -->
  <g transform="translate(50, 50)">
    <rect width="500" height="300" rx="12" fill="url(#cardGrad3)" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.03))" />
    
    <!-- Window Header -->
    <rect width="500" height="40" rx="12" fill="#f1f5f9" />
    <rect y="30" width="500" height="10" fill="#f1f5f9" />
    <circle cx="20" cy="20" r="6" fill="#ef4444" />
    <circle cx="40" cy="20" r="6" fill="#eab308" />
    <circle cx="60" cy="20" r="6" fill="#22c55e" />
    <text x="250" y="24" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="500">Full-Stack Application UI Mockup</text>
    
    <line x1="40" y1="80" x2="460" y2="80" stroke="#f1f5f9" stroke-width="1.5" />
    
    <!-- Left Navigation sidebar mockup -->
    <g transform="translate(30, 100)">
      <rect x="0" y="0" width="100" height="130" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <rect x="10" y="15" width="80" height="12" rx="3" fill="#10b981" />
      <rect x="10" y="37" width="80" height="12" rx="3" fill="#cbd5e1" />
      <rect x="10" y="59" width="80" height="12" rx="3" fill="#cbd5e1" />
      <rect x="10" y="81" width="80" height="12" rx="3" fill="#cbd5e1" />
    </g>
    
    <!-- Main Content layout area (Right) -->
    <g transform="translate(150, 100)">
      <rect x="0" y="0" width="310" height="130" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <circle cx="40" cy="40" r="20" fill="#e2e8f0" />
      <rect x="75" y="25" width="150" height="12" rx="3" fill="#1e293b" />
      <rect x="75" y="45" width="90" height="8" rx="2" fill="#64748b" />
      
      <rect x="20" y="80" width="80" height="35" rx="4" fill="#ecfeff" stroke="#a5f3fc" />
      <rect x="115" y="80" width="80" height="35" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
      <rect x="210" y="80" width="80" height="35" rx="4" fill="#fef2f2" stroke="#fecaca" />
    </g>
    
    <text x="40" y="275" font-family="monospace" font-size="11" fill="#94a3b8">Responsive Design | RESTful Web Services</text>
  </g>
</svg>
